[project]
name = "zerogen"
version = "0.2.0"
description = "The official Python library for the ZeroGen API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "ZeroGen LLC" }]
keywords = ["zerogen", "generative-ai", "image-generation", "video-generation", "api"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
requires-python = ">=3.10"
dependencies = [
    "anyio>=4.5",
    "httpx>=0.27,<1",
    "pydantic>=2.11,<3",
    "typing-extensions>=4.12",
]

[project.urls]
Homepage = "https://github.com/zerogeneration/zerogen-python"
Documentation = "https://docs.zerogen.com"
Issues = "https://github.com/zerogeneration/zerogen-python/issues"
Changelog = "https://github.com/zerogeneration/zerogen-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "datamodel-code-generator>=0.35",
    "pyright[nodejs]>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.14",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "PT", "RUF"]
exclude = ["src/zerogen/types/*"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.10"
typeCheckingMode = "strict"
reportPrivateUsage = false

[tool.pytest.ini_options]
testpaths = ["tests"]
